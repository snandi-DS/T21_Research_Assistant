# ============================================
# Shared Milvus Vector Database Stack
# ============================================
# FILE: docker-compose.milvus.yml
# PURPOSE: Standalone Milvus instance shared across multiple projects
#
# Any project's API container can connect to this Milvus via:
#   - From inside Docker:  host.docker.internal:19530
#   - From host machine:   localhost:19530
#
# Usage:
#   Start:   docker compose -f docker-compose.milvus.yml up -d
#   Stop:    docker compose -f docker-compose.milvus.yml down
#   Logs:    docker compose -f docker-compose.milvus.yml logs -f milvus
#   Status:  docker compose -f docker-compose.milvus.yml ps
#
# Health check:
#   curl http://localhost:19530/healthz
#
# All data is persisted in ./volumes/milvus_shared/
# Move this file to any shared directory as needed.
# ============================================

services:
  # ============================================
  # etcd — Milvus metadata store
  # ============================================
  milvus_shared_etcd:
    container_name: milvus_shared_etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/milvus_shared/etcd:/etcd
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      milvus_shared_network:
        aliases:
          - milvus-shared-etcd
    restart: unless-stopped

  # ============================================
  # MinIO — Milvus object storage
  # ============================================
  milvus_shared_minio:
    container_name: milvus_shared_minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"   # MinIO console  →  http://localhost:9001
      - "9000:9000"   # MinIO API
    volumes:
      - ./volumes/milvus_shared/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      milvus_shared_network:
        aliases:
          - milvus-shared-minio
    restart: unless-stopped

  # ============================================
  # Milvus Vector Database (standalone mode)
  # ============================================
  milvus_shared:
    container_name: milvus_shared
    image: milvusdb/milvus:v2.3.3
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-shared-etcd:2379
      MINIO_ADDRESS: milvus-shared-minio:9000
    volumes:
      - ./volumes/milvus_shared/milvus:/var/lib/milvus
    ports:
      - "19530:19530"   # gRPC — connect from any project on this host
      - "9091:9091"     # Metrics / health:  curl http://localhost:9091/healthz
    depends_on:
      milvus_shared_etcd:
        condition: service_healthy
      milvus_shared_minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    networks:
      milvus_shared_network:
        aliases:
          - milvus-shared
    restart: unless-stopped

networks:
  milvus_shared_network:
    name: milvus_shared_network
    driver: bridge
